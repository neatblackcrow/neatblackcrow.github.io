projects:
  - id: "quest-driven-cat-simulator"
    name: "Quest-Driven Cat Simulator"
    summary: "Cross-platform productivity application and isometric virtual cat simulator for Android and Flutter Web built with Flutter, Flame Engine, Riverpod 3, and on-device LiteRT-LM AI—gamifying hierarchical task scheduling into a Mana-driven autonomous pet simulation with zero cloud AI dependencies."
    highlights:
      - "Engineered local-first on-device LLM inference via flutter_edge_ai and LiteRT-LM (bundled Gemma 3 1B IT on Android; token-free Gemma 4 E2B IT WebGPU streamed through a Cloudflare Worker CORS proxy into reload-safe atomic browser OPFS storage on Web) with a single shared model weight instance, bounded 4-turn per-cat KV sessions, FIFO turn queuing, and deterministic heuristic fallbacks."
      - "Built discrete isometric Flame rooms (Living Room, Bedroom, Bathroom) with 2-layer enclosure depth sorting, doorway-routed multi-cat pathfinding, a 4-stat simulation engine (Hunger, Hygiene, Happiness, Energy with an 8+ hour biological sleep cycle), SQLite v9 + background worker isolate on Android, and localStorage persistence on Web."
      - "Applied Dart 3 sealed-class ADTs, exhaustive pattern matching, and zero-cost extension-type constraints across a continuous multi-day 24-hour timeline supporting 5-minute-snapped drag/resize, cascading non-overlapping schedule validation, idempotent Mana rewards, and Time Effectiveness analytics."
    tags:
