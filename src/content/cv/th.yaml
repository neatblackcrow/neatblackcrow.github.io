projects:
  - id: "quest-driven-cat-simulator"
    name: "Quest-Driven Cat Simulator"
    summary: "แอปจัดการงานและเกมจำลองเลี้ยงแมวแบบไอโซเมตริกสำหรับ Android และ Flutter Web ด้วย Flutter, Flame, Riverpod 3 และ LiteRT-LM AI บนอุปกรณ์—แปลงตารางงานและเทมเพลตกิจวัตรเป็นรางวัล Mana โดยไม่ต้องพึ่ง Cloud AI"
    highlights:
      - "ออกแบบระบบประมวลผล AI บนอุปกรณ์แบบออฟไลน์และเน้นความเป็นส่วนตัว (Gemma 4 E2B IT ผ่าน LiteRT-LM บน Android และ WebGPU/OPFS บน Web) พร้อม Native Function Calling, การจำกัดหน่วยความจำเซสชัน, การยืนยันก่อนดาวน์โหลด และ Heuristic สำรอง เพื่อตัดค่าใช้จ่าย Cloud AI"
      - "วางสถาปัตยกรรมกราฟสถานะ Riverpod 3 แบบไม่มีวงจร (0 Cycles จาก 64 โหนด) ด้วย Dart 3 Sealed Class ADTs และชุดทดสอบอัตโนมัติ 332 รายการ พร้อมแยกการทำงานของ Flame 60 FPS ออกจากการอัปเดต UI ที่ไม่เกี่ยวกับภาพ"
      - "พัฒนาฉากห้องไอโซเมตริกด้วย Flame พร้อมการหาเส้นทางหลบสิ่งกีดขวางแบบ Dijkstra แอนิเมชัน 336 ชุด ระบบจำลอง 4 ค่าสถานะ (ความหิว ความสะอาด ความสุข และพลังงาน) และการจัดเก็บข้อมูลด้วย SQLite (WAL) / browser localStorage"
      - "พัฒนาไทม์ไลน์ 24 ชั่วโมงแบบต่อเนื่องหลายวัน รองรับการลาก/ปรับขนาดงานทีละ 5 นาทีข้ามเที่ยงคืน ระบบ Routine Presets ที่เลื่อนหลีกเลี่ยงงานชนกันอัตโนมัติ การให้ Mana แบบไม่ซ้ำ และสถิติ Time Effectiveness"
    tags:
      - "Dart"
      - "Flutter"
      - "Flame"
      - "Riverpod"
      - "LiteRT-LM"
      - "WebGPU"
      - "SQLite"
      - "Cloudflare Workers"
    liveUrl: "https://cat-simulator.fieldfirst2012.workers.dev"

