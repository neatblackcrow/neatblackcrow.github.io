summary: >-
  บัณฑิตวิทยาการคอมพิวเตอร์ (เกียรตินิยมอันดับสอง มหาวิทยาลัยเกษตรศาสตร์) มีประสบการณ์ครอบคลุมทั้งการพัฒนาเว็บแอปพลิเคชัน การบริหารจัดการฐานข้อมูล Oracle การดูแลเสถียรภาพระบบ Linux/Docker และการสนับสนุนระบบงานระดับองค์กร มีประวัติการทำงานร่วมกับระบบสำคัญของภาครัฐและฟินเทค ทั้งการแก้ไขปัญหาเร่งด่วนภายใต้ SLA 15 นาที การดูแลระบบสถิติแบบคอนเทนเนอร์ และการสนับสนุนการเชื่อมต่อระบบ eKYC และ Insurance POS

