summary: >-
  บัณฑิตวิทยาการคอมพิวเตอร์ (เกียรตินิยมอันดับสอง มหาวิทยาลัยเกษตรศาสตร์) มีประสบการณ์ครอบคลุมทั้งการพัฒนาซอฟต์แวร์แบบ Full-Stack การบริหารจัดการฐานข้อมูล Oracle การดูแลเสถียรภาพระบบ Linux/Docker และการสนับสนุนระบบงานระดับองค์กร มีประวัติการทำงานร่วมกับระบบสำคัญของภาครัฐและฟินเทค ทั้งการแก้ไขปัญหาเร่งด่วนภายใต้ SLA 15 นาที การดูแลระบบสถิติแบบคอนเทนเนอร์ และการสนับสนุนการเชื่อมต่อระบบ eKYC และ Insurance POS ควบคู่กับประสบการณ์พัฒนาซอฟต์แวร์ด้วย Go, TypeScript/React, Flutter และ AI บนอุปกรณ์

